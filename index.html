<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iluminación Inteligente por Voz</title>
<style>
  :root { --bg:#0f1220; --card:#1a1f36; --txt:#e8ebff; --acc:#ffd54a; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; font-family: system-ui, Arial, sans-serif;
    background: var(--bg); color: var(--txt);
    display:flex; flex-direction:column; align-items:center; padding:24px;
    transition: background .5s;
  }
  body.on { background:#2a2a1a; }
  h1 { margin:0 0 4px; font-size:1.6rem; text-align:center; }
  p.sub { margin:0 0 20px; opacity:.75; text-align:center; }
  .wrap { display:flex; flex-wrap:wrap; gap:24px; justify-content:center; width:100%; max-width:900px; }
  .card { background:var(--card); border-radius:16px; padding:20px; flex:1 1 320px; max-width:420px; }
  .lamp { text-align:center; }
  svg { width:220px; height:auto; }
  #glow { opacity:0; transition: opacity .5s; }
  body.on #glow { opacity:1; }
  #bulb { fill:#555; transition: fill .5s; }
  body.on #bulb { fill: var(--acc); }
  #estado { font-size:1.4rem; font-weight:700; margin-top:8px; }
  button {
    font-size:1rem; padding:12px 20px; border:0; border-radius:10px; cursor:pointer;
    background:#3d6bff; color:#fff; font-weight:600; margin:4px;
  }
  button.sec { background:#394068; }
  button:disabled { opacity:.5; cursor:default; }
  .bar { margin:12px 0; }
  .bar .lbl { display:flex; justify-content:space-between; font-size:.9rem; margin-bottom:4px; }
  .bar .track { height:16px; background:#0d1020; border-radius:8px; overflow:hidden; }
  .bar .fill { height:100%; width:0; background:#3d6bff; transition: width .15s; }
  .bar.top .fill { background:#4cd37b; }
  #msg { font-size:.9rem; opacity:.8; min-height:1.2em; margin-top:8px; }
  .slider { margin-top:14px; }
  input[type=range] { width:100%; }
</style>
</head>
<body>

<h1>💡 Iluminación Inteligente por Voz</h1>
<p class="sub">Di <b>"Prender"</b> o <b>"Apagar"</b></p>

<div class="wrap">
  <div class="card lamp">
    <svg viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
      <g id="glow">
        <circle cx="100" cy="90" r="90" fill="#ffd54a" opacity=".15"/>
        <circle cx="100" cy="90" r="65" fill="#ffd54a" opacity=".2"/>
      </g>
      <circle id="bulb" cx="100" cy="90" r="45"/>
      <rect x="80" y="130" width="40" height="14" rx="3" fill="#888"/>
      <rect x="84" y="144" width="32" height="12" rx="3" fill="#777"/>
      <rect x="88" y="156" width="24" height="10" rx="3" fill="#666"/>
      <rect x="60" y="215" width="80" height="12" rx="6" fill="#444"/>
      <rect x="95" y="166" width="10" height="50" fill="#555"/>
    </svg>
    <div id="estado">APAGADA</div>

    <div class="slider">
      <label for="brillo">Brillo: <span id="brilloVal">100</span>%</label>
      <input type="range" id="brillo" min="10" max="100" value="100">
    </div>

    <div style="margin-top:12px">
      <button class="sec" id="btnOn">Prender (manual)</button>
      <button class="sec" id="btnOff">Apagar (manual)</button>
    </div>
  </div>

  <div class="card">
    <button id="btnStart">🎤 Iniciar micrófono</button>
    <button class="sec" id="btnStop" disabled>Detener</button>
    <div id="msg">Presiona "Iniciar micrófono" y permite el acceso.</div>
    <div id="barras"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>

<script>
  // Enlace de tu modelo de Teachable Machine
  const URL = "https://teachablemachine.withgoogle.com/models/Gq-HH1pZi/";

  // Confianza mínima para aceptar un comando (0 a 1)
  const UMBRAL = 0.80;

  let recognizer = null;
  let etiquetas = [];
  let luzEncendida = false;
  let ultimoComando = 0;

  const body = document.body;
  const estado = document.getElementById("estado");
  const msg = document.getElementById("msg");
  const barras = document.getElementById("barras");
  const btnStart = document.getElementById("btnStart");
  const btnStop = document.getElementById("btnStop");
  const brillo = document.getElementById("brillo");
  const brilloVal = document.getElementById("brilloVal");

  function aplicarLuz() {
    body.classList.toggle("on", luzEncendida);
    estado.textContent = luzEncendida ? "ENCENDIDA" : "APAGADA";
    document.getElementById("glow").style.opacity = luzEncendida ? brillo.value / 100 : 0;
    document.getElementById("bulb").style.opacity = luzEncendida ? (0.4 + 0.6 * brillo.value / 100) : 1;
  }

  function prender() { luzEncendida = true; aplicarLuz(); }
  function apagar()  { luzEncendida = false; aplicarLuz(); }

  document.getElementById("btnOn").onclick = prender;
  document.getElementById("btnOff").onclick = apagar;
  brillo.oninput = () => { brilloVal.textContent = brillo.value; aplicarLuz(); };

  function crearBarras() {
    barras.innerHTML = "";
    etiquetas.forEach((et, i) => {
      const d = document.createElement("div");
      d.className = "bar";
      d.id = "bar" + i;
      d.innerHTML =
        '<div class="lbl"><span>' + et + '</span><span class="pct">0%</span></div>' +
        '<div class="track"><div class="fill"></div></div>';
      barras.appendChild(d);
    });
  }

  function interpretar(nombre) {
    const n = nombre.toLowerCase();
    if (n.includes("prende") || n.includes("enciende")) return "on";
    if (n.includes("apaga")) return "off";
    return null;
  }

  async function iniciar() {
    btnStart.disabled = true;
    msg.textContent = "Cargando el modelo...";
    try {
      if (!recognizer) {
        recognizer = speechCommands.create(
          "BROWSER_FFT", undefined,
          URL + "model.json", URL + "metadata.json"
        );
        await recognizer.ensureModelLoaded();
        etiquetas = recognizer.wordLabels();
        crearBarras();
      }

      recognizer.listen(result => {
        const scores = result.scores;
        let mejor = 0;
        scores.forEach((s, i) => { if (s > scores[mejor]) mejor = i; });

        scores.forEach((s, i) => {
          const el = document.getElementById("bar" + i);
          el.querySelector(".fill").style.width = (s * 100).toFixed(0) + "%";
          el.querySelector(".pct").textContent = (s * 100).toFixed(0) + "%";
          el.classList.toggle("top", i === mejor);
        });

        const accion = interpretar(etiquetas[mejor]);
        const ahora = Date.now();
        if (accion && scores[mejor] >= UMBRAL && ahora - ultimoComando > 1200) {
          ultimoComando = ahora;
          if (accion === "on") prender(); else apagar();
          msg.textContent = "Comando detectado: " + etiquetas[mejor];
        }
      }, {
        includeSpectrogram: true,
        probabilityThreshold: 0.5,
        invokeCallbackOnNoiseAndUnknown: true,
        overlapFactor: 0.5
      });

      btnStop.disabled = false;
      msg.textContent = "Escuchando... di un comando.";
    } catch (e) {
      console.error(e);
      msg.textContent = "Error: " + e.message + ". Revisa el permiso del micrófono y que uses Chrome.";
      btnStart.disabled = false;
    }
  }

  function detener() {
    if (recognizer && recognizer.isListening()) recognizer.stopListening();
    btnStart.disabled = false;
    btnStop.disabled = true;
    msg.textContent = "Micrófono detenido.";
  }

  btnStart.onclick = iniciar;
  btnStop.onclick = detener;
  aplicarLuz();
</script>
</body>
</html>
